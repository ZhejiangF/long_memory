# dsh-plugin-ltm 的组合行：dsh plugin add 会把这一层叠进 profile，
# 由 loader 插入下面这条 entry。字段含义见 package.json 的 dsh.bundle。
- insert:
    - id: ltm-memory
      name: dsh-plugin-ltm
      config:
        # 自动记住每条真人发言与助手回复（和 Python 库一致）；设为 false 只保留手动工具。
        autoCapture: true
        # 助手回复也记；只记用户就设 false。
        captureAssistant: true
        # 记忆体默认落在 <DSH_HOME>/ltm/memory.db，首次启动是空库；
        # 要换路径或解释器时在这里加 dbPath / python / pythonPath。
        # 从空白记忆体重新开始：启动前把这一项临时改成 true，启动一次再改回来。
        resetOnStart: false
        # 召回默认返回几条。
        recallLimit: 8
        # 每写几次原话自动整理一次（0 表示关闭）。取代“每天九点定时保存”。
        consolidateEvery: 10
        # 缓冲区攒到几句就批量整理（小睡）。默认 600 偏大，日常聊天可调到 20–60。
        # napSentences: 600
        # 夜间整理的时刻（0-23）。按消息时间戳跨过该时刻补做，不是定时器。
        # nightHour: 3
